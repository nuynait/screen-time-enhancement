name: ScreenTimeEnhancement
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  GateExtension:
    type: app-extension
    platform: iOS
    sources:
      - Core
      - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/Gate.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
targets:
  Gate:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/Gate.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Gate
        GateAppGroup: $(GATE_APP_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: $(GATE_BUNDLE_ID)
            CFBundleURLSchemes:
              - calculationgate
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: GateShieldAction
      - target: GateShieldConfiguration
      - target: GateActivityMonitor
  GateShieldAction:
    templates: [GateExtension]
    sources: [Extensions/ShieldAction]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_ID).shield-action
    info:
      path: Config/ShieldAction-Info.plist
      properties:
        GateAppGroup: $(GATE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
  GateShieldConfiguration:
    templates: [GateExtension]
    sources: [Extensions/ShieldConfiguration]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_ID).shield-configuration
    info:
      path: Config/ShieldConfiguration-Info.plist
      properties:
        GateAppGroup: $(GATE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
  GateActivityMonitor:
    templates: [GateExtension]
    sources: [Extensions/ActivityMonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_ID).activity-monitor
    info:
      path: Config/ActivityMonitor-Info.plist
      properties:
        GateAppGroup: $(GATE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitorExtension
  GateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - Core
      - Shared/GateState.swift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gate
    dependencies:
      - target: Gate
  GateAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_ID).apptests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Gate
schemes:
  Gate:
    build:
      targets:
        Gate: all
    test:
      commandLineArguments:
        "--demo": true
      targets: [GateUITests, GateAppTests]
